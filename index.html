<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>richardsprague — Facet</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    h1 { font-size: 1.25rem; }
    ul { padding-left: 1.25rem; }
    .note { margin-top: 1.5rem; color: #444; }
    .err { color: #a00; }
  </style>
</head>
<body>
  <h1 id="name"></h1>
  <ul id="public"></ul>
  <p class="note" id="sealed"></p>
  <p class="err" id="err" hidden></p>
  <script>
  (function () {
    var nameEl = document.getElementById("name");
    var list = document.getElementById("public");
    var sealed = document.getElementById("sealed");
    var err = document.getElementById("err");
    sealed.textContent = "Sealed tiers need a grant.";
    fetch("card.json", { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("card.json HTTP " + r.status);
        return r.json();
      })
      .then(function (card) {
        nameEl.textContent = card.name || card.handle || "";
        var lines = card.public || [];
        for (var i = 0; i < lines.length; i++) {
          var li = document.createElement("li");
          li.textContent = lines[i];
          list.appendChild(li);
        }
      })
      .catch(function (e) {
        err.hidden = false;
        err.textContent = "Could not load card.json";
      });
  })();
  </script>
</body>
</html>
